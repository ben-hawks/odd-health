# Builds a signed release APK when a GitHub release is published, and attaches
# it to that release. Copy this file to .github/workflows/release.yml.
# Setup (secrets, keystore): docs/release.md.
name: Release

on:
  release:
    types: [published]

permissions:
  contents: write # to upload the APK to the release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$GITHUB_REF_NAME' is not vMAJOR.MINOR.PATCH (e.g. v1.0.0)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Android SDK packages
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests
        run: |
          python3 -m unittest discover -s tests
          cd android && ./gradlew :protocol:test :core:test :app:testDebugUnitTest

      - name: Release keystore
        env:
          ODD_KEYSTORE_BASE64: ${{ secrets.ODD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ODD_KEYSTORE_BASE64" ]; then
            echo "::error::Secret ODD_KEYSTORE_BASE64 is not set. See docs/release.md."
            exit 1
          fi
          echo "$ODD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Build signed release
        env:
          ODD_KEYSTORE: ${{ runner.temp }}/release.jks
          ODD_KEYSTORE_PASSWORD: ${{ secrets.ODD_KEYSTORE_PASSWORD }}
          ODD_KEY_ALIAS: ${{ secrets.ODD_KEY_ALIAS }}
          ODD_KEY_PASSWORD: ${{ secrets.ODD_KEY_PASSWORD }}
        run: cd android && ./gradlew :app:assembleRelease -PversionName=${{ steps.version.outputs.version }}

      - name: Check signature and name the APK
        id: apk
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$APK" ]; then
            echo "::error::No signed APK (the build produced an unsigned one?). Check the signing secrets."
            exit 1
          fi
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK"
          OUT="odd-health-${{ steps.version.outputs.version }}.apk"
          cp "$APK" "$OUT"
          sha256sum "$OUT" > "$OUT.sha256"
          echo "file=$OUT" >> "$GITHUB_OUTPUT"

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "${{ steps.apk.outputs.file }}" "${{ steps.apk.outputs.file }}.sha256" --clobber

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
